<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lida Xu</title>
    <meta name="description" content="Lida Xu — Machine Learning Engineer.">
    <style>
        :root {
            --text: #1a1a1a;
            --muted: #5f6368;
            --accent: #0b57d0;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: #ffffff;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 28px 0;
        }

        .wordmark {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        main {
            padding: 72px 0 96px;
        }

        h1 {
            font-size: 44px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .role {
            font-size: 20px;
            color: var(--muted);
            margin-top: 12px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            margin-top: 28px;
            font-size: 15px;
        }

        .links span {
            color: var(--muted);
        }

        @media (max-width: 600px) {
            main {
                padding: 48px 0 64px;
            }

            h1 {
                font-size: 34px;
            }

            .role {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="wrap">
            <span class="wordmark">Lida Xu</span>
        </div>
    </header>

    <main class="wrap">
        <h1>Lida Xu</h1>
        <p class="role">Machine Learning Engineer</p>
        <div class="links">
            <span>Cambridge, MA</span>
            <a href="mailto:xulida93@gmail.com">xulida93@gmail.com</a>
            <a href="https://github.com/halcyon0811">GitHub</a>
        </div>
    </main>
</body>

</html>
